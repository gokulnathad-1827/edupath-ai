spring.application.name=auth-service

server.port=${PORT:8081}

spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/oauth_db}
spring.data.mongodb.database=oauth_db
spring.data.mongodb.auto-index-creation=true

# Spring Mail SMTP Configuration (Gmail)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:gokulnath.ad.1827@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:gohvvghqxkoxofhk}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
