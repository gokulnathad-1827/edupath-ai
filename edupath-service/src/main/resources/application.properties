spring.application.name=edupath-service

server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/edupath_ai?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:nath@1827}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=*

logging.level.org.springframework.security=INFO

jwt.secret=${JWT_SECRET:ThisIsMyVeryStrongSecretKeyForEduPathAuthService2026Minimum32Characters}

ai.service.url=${AI_SERVICE_URL:http://localhost:8084/api/ai/dropout-risk}

cors.origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}


